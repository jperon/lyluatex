name: MiKTeX Windows test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'lyluatex.lua'
      - 'lyluatex.sty'
      - 'luaoptions/**'
      - 'test*.tex'
      - '.github/workflows/miktex.yml'

jobs:
  miktex-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Show checkout contents
        shell: pwsh
        run: |
          git submodule status
          Get-ChildItem
          Get-ChildItem luaoptions

      - name: Install MiKTeX
        shell: pwsh
        run: |
          choco install miktex.install -y

          $miktexBin = "C:\Program Files\MiKTeX\miktex\bin\x64"

          if (!(Test-Path $miktexBin)) {
            Write-Error "MiKTeX bin directory not found: $miktexBin"
          }

          # Current step
          $env:Path = "$miktexBin;$env:Path"

          # Following steps
          $miktexBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          where.exe initexmf
          where.exe lualatex
          
          initexmf --admin --update-fndb
          initexmf --admin --set-config-value=[MPM]AutoInstall=1

      - name: Install modern Ghostscript
        shell: pwsh
        run: |
          choco install ghostscript -y
      
          $gsRoot = Get-ChildItem "C:\Program Files\gs" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
      
          if (!$gsRoot) {
            Write-Error "Ghostscript installation directory not found"
          }
      
          $gsBin = Join-Path $gsRoot.FullName "bin"
      
          if (!(Test-Path (Join-Path $gsBin "gswin64c.exe"))) {
            Write-Error "gswin64c.exe not found in $gsBin"
          }
      
          # Make modern Ghostscript available in this step and following steps.
          $env:Path = "$gsBin;$env:Path"
          $gsBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
          where.exe gswin64c
          gswin64c --version

      - name: Install LilyPond
        shell: pwsh
        run: |
          choco install lilypond -y

          $chocoBin = "C:\ProgramData\chocolatey\bin"
          $env:Path = "$chocoBin;$env:Path"
          $chocoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show versions
        shell: pwsh
        run: |
          where.exe lualatex
          where.exe lilypond
          where.exe gswin64c
          where.exe miktex-epstopdf
      
          lualatex --version
          lilypond --version
          gswin64c --version
          initexmf --report

      - name: Run existing tests
        shell: pwsh
        run: |
          $env:TEXINPUTS = ".;luaoptions;"
          $env:LUAINPUTS = ".;luaoptions;"
        
          Write-Host "TEXINPUTS=$env:TEXINPUTS"
          Write-Host "LUAINPUTS=$env:LUAINPUTS"
        
          kpsewhich lyluatex.sty
          kpsewhich lyluatex.lua
          kpsewhich luaoptions.sty
          kpsewhich luaoptions-lib.lua
        
          lualatex -interaction=nonstopmode -shell-escape test.tex
          lualatex -interaction=nonstopmode -shell-escape test.en.tex
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miktex-test-artifacts
          path: |
            *.log
            *.pdf
            tmp-ly/**
