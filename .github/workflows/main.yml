name: MiKTeX Windows test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - miktex
    paths:
      - 'lyluatex.lua'
      - 'lyluatex.sty'
      - 'luaoptions/**'
      - 'test*.tex'
      - '.github/workflows/miktex.yml'

jobs:
  miktex-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Show checkout contents
        shell: pwsh
        run: |
          git submodule status
          Get-ChildItem
          Get-ChildItem luaoptions

      - name: Install MiKTeX
        shell: pwsh
        run: |
          choco install miktex.install -y

          $miktexBin = "C:\Program Files\MiKTeX\miktex\bin\x64"

          if (!(Test-Path $miktexBin)) {
            Write-Error "MiKTeX bin directory not found: $miktexBin"
          }

          # Current step
          $env:Path = "$miktexBin;$env:Path"

          # Following steps
          $miktexBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          where.exe initexmf
          where.exe lualatex
          
          initexmf --admin --update-fndb
          initexmf --admin --set-config-value=[MPM]AutoInstall=1

      - name: Install LilyPond
        shell: pwsh
        run: |
          choco install lilypond -y

          $possible = @(
            "C:\Program Files\LilyPond\usr\bin",
            "C:\Program Files (x86)\LilyPond\usr\bin"
          )

          $lilypondBin = $possible | Where-Object { Test-Path (Join-Path $_ "lilypond.exe") } | Select-Object -First 1

          if (!$lilypondBin) {
            Write-Error "LilyPond bin directory not found"
          }

          # Current step
          $env:Path = "$lilypondBin;$env:Path"

          # Following steps
          $lilypondBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show versions
        shell: pwsh
        run: |
          lualatex --version
          lilypond --version
          initexmf --report
          kpsewhich lyluatex.lua

      - name: Run existing tests
        shell: pwsh
        run: |
          if (Get-Command make -ErrorAction SilentlyContinue) {
            make test
          } else {
            $env:TEXINPUTS = "luaoptions:"
            lualatex -interaction=nonstopmode -shell-escape test.tex
            lualatex -interaction=nonstopmode -shell-escape test.end.tex
            lualatex -interaction=nonstopmode -shell-escape test-alignment.tex
          }
